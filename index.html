<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SayedTech | Coming Soon — قريباً</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="SayedTech Official Website. Coming soon - الموقع الرسمي لـ سيد التقنية. قريباً إن شاء الله.">
  <meta name="robots" content="index, follow">
  
  <!-- PWA Metadata & Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png">
  <link rel="manifest" href="./site.webmanifest">
  <meta name="theme-color" content="#0A0A0A">

  <!-- Google Fonts Preconnect & Load -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- FontAwesome 6.5.1 (supporting modern X logo) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Master Stylesheet -->
  <link rel="stylesheet" href="./src/css/main.css">
</head>
<body>

  <div class="portal-container">
    <!-- Ambient Decor Bubbles -->
    <div class="ambient-glow glow-bubble-1"></div>
    <div class="ambient-glow glow-bubble-2"></div>

    <div class="content-wrapper">
      <!-- Top Action Toggles -->
      <header class="portal-header-actions">
        <!-- Language Switcher Button -->
        <button class="action-btn" id="lang-toggle-btn" aria-label="Toggle language">
          <ion-icon name="language-outline"></ion-icon>
          <span id="lang-btn-text">العربية</span>
        </button>
        <!-- Theme Toggle Button -->
        <button class="action-btn" id="theme-toggle-btn" aria-label="Toggle theme">
          <ion-icon name="sunny-outline" id="theme-icon"></ion-icon>
        </button>
      </header>

      <!-- Main Coming Soon Content (No card container box) -->
      <main class="coming-soon-content">
        <!-- Logo Badge Avatar (with sharp corner fold-cut) -->
        <div class="avatar-container">
          <img src="./SayedTech-Logo-System/SVG/icon-badge.svg" alt="SayedTech Badge" class="profile-avatar" onerror="this.src='./favicon-256.png'">
        </div>

        <!-- Translated Profile Name -->
        <h1 class="profile-name" id="profile-name">Mr. Tech</h1>
        
        <a href="https://contact.sayedtechs.com" target="_blank" rel="noopener noreferrer" class="profile-handle" dir="ltr">
          @sayedtechs
        </a>

        <!-- Translated Bio Description -->
        <p class="profile-bio" id="profile-bio">Coming Soon</p>

        <!-- Premium CTA Button linking to contact subportal -->
        <a href="https://contact.sayedtechs.com" class="cta-button">
          <i class="fa-solid fa-address-book"></i>
          <span id="cta-text">Contact Us</span>
        </a>

      </main>

      <!-- Footer Wordmark -->
      <footer class="portal-footer">
        <img src="./SayedTech-Logo-System/SVG/logo-horizontal-reversed.svg" alt="SayedTech Logo" class="footer-logo">
        <p class="footer-text" dir="ltr">
          &copy; <span id="current-year">2026</span> <a href="https://sayedtechs.com" class="footer-link">@SayedTechs</a>. All rights reserved.
        </p>
      </footer>
    </div>
  </div>

  <!-- Ionicons Scripts for Theme Switcher Icons -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <!-- Application JS Controller -->
  <script src="./src/js/main.js"></script>
</body>
</html>
